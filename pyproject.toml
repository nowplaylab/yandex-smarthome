[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-smarthome"
version = "0.1.0"
description = "Yandex Smart Home from Python: sign in with a code (no password) and control lights"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["aiohttp>=3.8"]
authors = [{name = "nowplaylab"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Framework :: AsyncIO"]

[project.urls]
Homepage = "https://github.com/nowplaylab/yandex-smarthome"

[tool.setuptools]
packages = ["yandex_smarthome"]
